<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chernet Bingo</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #0d1117;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background-color: #161b22;
      padding: 10px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #238636;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 35px;
      height: 35px;
      background-color: #238636;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 16px;
    }

    .user-details h4 {
      font-size: 14px;
      color: #e6edf3;
    }

    .balance-badge {
      background-color: #238636;
      color: #ffffff;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
    }

    .top-stats {
      background-color: #161b22;
      display: flex;
      justify-content: space-around;
      padding: 8px 0;
      font-size: 13px;
      border-bottom: 1px solid #30363d;
    }

    .stat-item span {
      font-weight: bold;
      color: #3fb950;
    }

    .live-board-container {
      background-color: #010409;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-bottom: 1px solid #30363d;
    }

    .last-called-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #161b22;
      padding: 6px 12px;
      border-radius: 8px;
    }

    .current-ball {
      width: 45px;
      height: 45px;
      background: radial-gradient(circle at 30% 30%, #ff5555, #990000);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      font-weight: bold;
      box-shadow: 0 0 10px rgba(255, 85, 85, 0.6);
      animation: pop 0.3s ease-out;
    }

    @keyframes pop {
      0% { transform: scale(0.5); }
      100% { transform: scale(1); }
    }

    .history-balls {
      display: flex;
      gap: 6px;
      overflow-x: auto;
    }

    .small-ball {
      min-width: 28px;
      height: 28px;
      background-color: #21262d;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 11px;
      border: 1px solid #30363d;
    }

    .cards-grid-container {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .grid-title {
      font-size: 14px;
      margin-bottom: 8px;
      color: #8b949e;
      text-align: center;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .card-btn {
      background-color: #21262d;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 12px 0;
      color: #ffffff;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .card-btn.selected {
      background-color: #238636;
      border-color: #3fb950;
      box-shadow: 0 0 8px rgba(63, 185, 80, 0.4);
    }

    .card-btn.taken {
      background-color: #da3633;
      border-color: #f85149;
      opacity: 0.6;
      cursor: not-allowed;
    }

    .active-playing-view {
      display: none;
      flex: 1;
      flex-direction: column;
      align-items: center;
      padding: 10px;
      overflow-y: auto;
    }

    .bingo-card {
      background-color: #161b22;
      border: 2px solid #30363d;
      border-radius: 10px;
      width: 100%;
      max-width: 330px;
      padding: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .bingo-header {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      text-align: center;
      font-weight: 900;
      font-size: 18px;
      color: #3fb950;
      margin-bottom: 5px;
    }

    .bingo-body {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
    }

    .cell {
      background-color: #21262d;
      aspect-ratio: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 15px;
      font-weight: bold;
      border-radius: 4px;
      border: 1px solid #30363d;
    }

    .cell.star {
      color: #e3b341;
      font-size: 18px;
    }

    .cell.marked {
      background-color: #238636;
      color: white;
    }

    .bingo-btn {
      margin-top: 15px;
      width: 100%;
      max-width: 330px;
      background: linear-gradient(135deg, #238636, #2ea043);
      color: white;
      border: none;
      padding: 12px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(46, 160, 67, 0.4);
      cursor: pointer;
    }

    .bingo-btn:active {
      transform: scale(0.98);
    }

    footer {
      background-color: #161b22;
      padding: 8px;
      text-align: center;
      font-size: 11px;
      color: #8b949e;
      border-top: 1px solid #30363d;
    }
  </style>
</head>
<body>

  <header>
    <div class="user-info">
      <div class="avatar" id="userAvatar">U</div>
      <div class="user-details">
        <h4 id="userName">ተጫዋች</h4>
      </div>
    </div>
    <div class="balance-badge" id="userBalance">0.00 ETB</div>
  </header>

  <div class="top-stats">
    <div class="stat-item">ቆጣሪ: <span id="timerVal">30</span>ሰከንድ</div>
    <div class="stat-item">ተጫዋቾች: <span id="playersCount">0</span></div>
    <div class="stat-item">ደራሽ: <span id="derashVal">0</span> ETB</div>
  </div>

  <div class="live-board-container">
    <div class="last-called-bar">
      <div style="font-size: 12px; color: #8b949e;">የመጨረሻ ቁጥር፦</div>
      <div class="current-ball" id="currentBall">-</div>
      <div style="font-size: 12px; color: #8b949e;">የወጡ: <span id="calledCount" style="color:white;">0</span>/75</div>
    </div>
    <div class="history-balls" id="historyBalls"></div>
  </div>

  <div class="cards-grid-container" id="lobbyView">
    <div class="grid-title">እባክዎ የካርቴላ ቁጥር ይምረጡ (አንዱ 10 ETB)</div>
    <div class="cards-grid" id="cardsGrid"></div>
  </div>

  <div class="active-playing-view" id="playingView">
    <div class="bingo-card">
      <div class="bingo-header">
        <div>B</div><div>I</div><div>N</div><div>G</div><div>O</div>
      </div>
      <div class="bingo-body" id="bingoBody"></div>
    </div>
    <button class="bingo-btn" onclick="claimBingo()">BINGO! 🎯</button>
  </div>

  <footer>
    Chernet Bingo System &copy; 2026 | All Rights Reserved
  </footer>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    const socket = io("https://cherbingo-backend.onrender.com");

    const user = tg?.initDataUnsafe?.user || {
      id: "1136433526",
      first_name: "Demo Player"
    };

    let selectedCards = [];
    let calledNumbersSet = new Set();
    let currentCardData = [];

    document.getElementById('userName').innerText = user.first_name;
    document.getElementById('userAvatar').innerText = user.first_name.charAt(0).toUpperCase();

    socket.emit('getUserBalance', { userId: user.id });

    socket.on('userBalanceUpdate', (data) => {
      document.getElementById('userBalance').innerText = `${data.balance.toFixed(2)} ETB`;
    });

    const cardsGrid = document.getElementById('cardsGrid');
    for (let i = 1; i <= 100; i++) {
      const btn = document.createElement('div');
      btn.className = 'card-btn';
      btn.innerText = i;
      btn.id = `card-${i}`;
      btn.onclick = () => toggleCardSelection(i);
      cardsGrid.appendChild(btn);
    }

    function toggleCardSelection(cardNum) {
      const btn = document.getElementById(`card-${cardNum}`);
      if (btn.classList.contains('taken')) return;

      if (selectedCards.includes(cardNum)) {
        socket.emit('deselectCard', { cardNum, userId: user.id });
        selectedCards = selectedCards.filter(c => c !== cardNum);
        btn.classList.remove('selected');
      } else {
        socket.emit('selectCard', { cardNum, userId: user.id, userName: user.first_name });
      }
    }

    socket.on('cardSelectSuccess', (data) => {
      if (!selectedCards.includes(data.cardNum)) {
        selectedCards.push(data.cardNum);
      }
      const btn = document.getElementById(`card-${data.cardNum}`);
      if (btn) btn.classList.add('selected');
      document.getElementById('userBalance').innerText = `${data.newBalance.toFixed(2)} ETB`;
    });

    socket.on('cardSelectFailed', (data) => {
      alert(data.message);
    });

    socket.on('roomState', (data) => {
      document.getElementById('timerVal').innerText = data.timeLeft;
      document.getElementById('playersCount').innerText = data.playersCount;
      document.getElementById('derashVal').innerText = data.derash;

      for (let i = 1; i <= 100; i++) {
        const btn = document.getElementById(`card-${i}`);
        if (!btn) continue;
        
        if (data.soldCards.includes(i)) {
          if (!selectedCards.includes(i)) {
            btn.classList.add('taken');
            btn.classList.remove('selected');
          }
        } else {
          btn.classList.remove('taken');
          if (!selectedCards.includes(i)) {
            btn.classList.remove('selected');
          }
        }
      }
    });

    socket.on('gameStarted', () => {
      document.getElementById('lobbyView').style.display = 'none';
      document.getElementById('playingView').style.display = 'flex';
      
      if (selectedCards.length > 0) {
        socket.emit('getCardData', { cardNum: selectedCards[0] });
      }
    });

    socket.on('cardDataResponse', (data) => {
      currentCardData = data.card;
      renderBingoBoard(data.card);
    });

    function renderBingoBoard(cardArray) {
      const body = document.getElementById('bingoBody');
      body.innerHTML = '';
      
      cardArray.forEach((val) => {
        const cell = document.createElement('div');
        cell.className = 'cell';
        
        if (val === '★') {
          cell.innerText = '★';
          cell.classList.add('star', 'marked');
        } else {
          cell.innerText = val;
          if (calledNumbersSet.has(val)) {
            cell.classList.add('marked');
          }
        }
        body.appendChild(cell);
      });
    }

    socket.on('newBall', (data) => {
      calledNumbersSet.add(data.num);
      
      const currentBallEl = document.getElementById('currentBall');
      currentBallEl.innerText = `${data.letter}${data.num}`;
      
      document.getElementById('calledCount').innerText = data.ballsCalled;

      const historyContainer = document.getElementById('historyBalls');
      const smallBall = document.createElement('div');
      smallBall.className = 'small-ball';
      smallBall.innerText = data.num;
      historyContainer.prepend(smallBall);

      if (currentCardData.length > 0) {
        renderBingoBoard(currentCardData);
      }
    });

    socket.on('roomReset', () => {
      selectedCards = [];
      calledNumbersSet.clear();
      currentCardData = [];
      document.getElementById('lobbyView').style.display = 'block';
      document.getElementById('playingView').style.display = 'none';
      document.getElementById('historyBalls').innerHTML = '';
      document.getElementById('currentBall').innerText = '-';
      document.getElementById('calledCount').innerText = '0';
    });

    function claimBingo() {
      alert("🎯 BINGO ጥያቄዎ ለሲስተሙ ተልኳል! በመረጣቸው ቁጥሮች ላይ እየተረጋገጠ ነው።");
    }
  </script>
</body>
</html>
