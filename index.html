<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cherbingo Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }
        .card {
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }
        button {
            background-color: #0088cc;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <h1>🎰 Cherbingo</h1>
    <div class="card">
        <h3 id="user-name">እንኳን በደህና መጡ!</h3>
        <p>ቀሪ ሂሳብ፦ <span id="balance">0.00</span> ETB</p>
        <button onclick="startGame()">እቃ በ 10 ETB ይግዙ (Play)</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('user-name').innerText = `ሰላም፣ ${user.first_name}!`;
        }

        function startGame() {
            tg.showAlert("ጨዋታው በቅርቡ ይጀምራል!");
        }
    </script>
</body>
</html>
