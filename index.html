<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CherBingo Game</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; background: #222; color: #fff; margin: 0; padding: 20px; }
    h1 { color: #f39c12; margin-bottom: 5px; }
    .status-box { font-size: 18px; margin: 15px 0; padding: 10px; background: #333; border-radius: 8px; display: inline-block; min-width: 250px; }
    .current-number { font-size: 48px; font-weight: bold; color: #2ecc71; margin: 10px 0; min-height: 60px; }
    
    .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; max-width: 320px; margin: 20px auto; background: #444; padding: 10px; border-radius: 10px; }
    .cell { width: 55px; height: 55px; background: #fff; color: #000; font-size: 20px; font-weight: bold; display: flex; align-items: center; justify-content: center; border-radius: 5px; cursor: pointer; user-select: none; }
    .cell.free { background: #f39c12; color: #fff; }
    .cell.marked { background: #e74c3c; color: #fff; }

    .btn { padding: 12px 25px; font-size: 18px; font-weight: bold; background: #27ae60; color: #fff; border: none; border-radius: 5px; cursor: pointer; margin-top: 15px; }
    .btn-bingo { background: #e74c3c; font-size: 22px; width: 80%; max-width: 300px; }

    .cards-selection { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
    .card-option { background: #34495e; padding: 15px; border-radius: 8px; cursor: pointer; border: 2px solid transparent; }
    .card-option:hover { border-color: #f39c12; }
    .spectator-msg { color: #e67e22; font-weight: bold; margin-top: 15px; font-size: 18px; }
  </style>
</head>
<body>

  <h1>CherBingo</h1>

  <div class="status-box" id="statusBox">እየተጠበቀ ነው...</div>
  <div class="current-number" id="currentNum">-</div>

  <!-- የካርቴላ መምረጫ ስክሪን -->
  <div id="selectionScreen">
    <h3>እባክህ ካርቴላ ምረጥ (ቆጠራው ካለቀ በታዛቢነት ትከታተላለህ)</h3>
    <div class="cards-selection" id="cardsContainer"></div>
  </div>

  <!-- የጨዋታ ቦርድ (ካርቴላ ለያዙ) -->
  <div id="gameScreen" style="display: none;">
    <div class="grid" id="bingoBoard"></div>
    <button class="btn btn-bingo" id="bingoBtn" onclick="claimBingo()">BINGO!</button>
  </div>

  <!-- የታዛቢ ገፅ (ካርቴላ ለሌላቸው) -->
  <div id="spectatorScreen" style="display: none;">
    <div class="spectator-msg">ካርቴላ ስላልመረጥክ ጨዋታውን በመታዘብ ላይ ነህ...</div>
  </div>

  <script>
    const socket = io();
    let myCard = null;
    let markedIndices = new Set([12]); // FREE position

    socket.on('availableCards', (cards) => {
      const container = document.getElementById('cardsContainer');
      container.innerHTML = '';
      cards.forEach((card, index) => {
        const div = document.createElement('div');
        div.className = 'card-option';
        div.innerText = `ካርቴላ #${index + 1}`;
        div.onclick = () => selectCard(index);
        container.appendChild(div);
      });
    });

    function selectCard(index) {
      socket.emit('selectCard', index);
    }

    socket.on('cardAssigned', (card) => {
      myCard = card;
      document.getElementById('selectionScreen').style.display = 'none';
      document.getElementById('spectatorScreen').style.display = 'none';
      document.getElementById('gameScreen').style.display = 'block';
      renderBoard();
    });

    socket.on('statusUpdate', (data) => {
      const statusBox = document.getElementById('statusBox');
      if (data.state === 'WAITING') {
        statusBox.innerText = `ጨዋታው ለመጀመር ${data.countdown} ሰከንድ ቀረው...`;
      } else if (data.state === 'PLAYING') {
        statusBox.innerText = `ጨዋታው በሂደት ላይ ነው!`;
        
        // ካርቴላ ያልመረጠ ሰው ከሆነ በቀጥታ ወደ ታዛቢ ስክሪን እንዲሄድ ማድረግ (Refresh ሳያስፈልግ)
        if (!myCard) {
          document.getElementById('selectionScreen').style.display = 'none';
          document.getElementById('spectatorScreen').style.display = 'block';
        }
      }
    });

    socket.on('newNumber', (num) => {
      document.getElementById('currentNum').innerText = num;
    });

    function renderBoard() {
      const board = document.getElementById('bingoBoard');
      board.innerHTML = '';
      
      myCard.forEach((val, idx) => {
        const cell = document.createElement('div');
        cell.className = 'cell';
        
        if (idx === 12) {
          cell.classList.add('free');
          cell.innerText = 'FREE';
        } else {
          cell.innerText = val;
          if (markedIndices.has(idx)) cell.classList.add('marked');
          cell.onclick = () => toggleMark(idx);
        }
        board.appendChild(cell);
      });
    }

    function toggleMark(idx) {
      if (markedIndices.has(idx)) {
        markedIndices.delete(idx);
      } else {
        markedIndices.add(idx);
      }
      renderBoard();
    }

    function claimBingo() {
      socket.emit('claimBingo', Array.from(markedIndices));
    }

    socket.on('bingoResult', (res) => {
      alert(res.message);
    });

    socket.on('gameOver', (data) => {
      alert(`ጨዋታው ተጠናቋል! አሸናፊ፡ ${data.winner}`);
      location.reload();
    });
  </script>
</body>
</html>
